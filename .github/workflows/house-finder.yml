name: house-finder

on:
  schedule:
    # cron-job.org triggers the real 30-minute runs (see SETUP.md); GitHub often delays or
    # skips scheduled runs on quiet repos, so this is only a backup.
    # A private repo gets 2,000 free minutes a month; a normal run takes about one minute and
    # the once-a-day full search of Daft and MyHome takes a few more.
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: house-finder
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The bot's memory (seen listings, your Telegram changes) lives on the "state" branch,
      # so it never clutters main.
      - name: Check out state branch
        run: |
          git config user.name "house-finder bot"
          git config user.email "house-finder-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch --depth 1 origin state:state
            git worktree add data state
          else
            git worktree add --orphan -b state data
          fi

      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PAIR_CODE: ${{ secrets.PAIR_CODE }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m house_finder --state data/state.json

      - name: Save state
        if: always()
        working-directory: data
        run: |
          [ -f state.json ] || exit 0
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Update bot state"
          git push -q origin state
