# Starting preferences. Changes made from Telegram are saved in the bot's state
# (the "state" branch) and override these values.

budget:
  max: 700000
  htb_max: 500000          # Help to Buy price limit (new builds, first-time buyers)

# Order = priority. Allowed values: detached, semi-detached, terraced, end-of-terrace, apartment
property_types: [detached, semi-detached, end-of-terrace, terraced, apartment]

bedrooms: {min: 2, ideal: 3, max: 4}
bathrooms: {min: 2, ideal: 3}
apartment_min_bedrooms: 2
apartment_max_price: 500000

min_ber: B3                # A1 (best) .. G. "Green" labels are A1-B3.
parking_min: 1
exclude_sale_agreed: true
prefer_new_build: true

# A listing must mention at least one of these in its address.
# Leave empty to accept any area (your saved searches already filter by area).
