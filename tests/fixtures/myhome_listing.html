IsRequirement":false}],"BrochureContent":[{"ContentType":"Description","SortOrder":0,"Content":"We are delighted to introduce No. 1 Cairnbrook Way to the market, a beautifully presented three-bedroom, three-bathroom end-of-terrace home, ideally positioned within the highly regarded Cairnbrook development. Arranged over three spacious levels, this well-maintained home offers bright, versatile accommodation with a private rear garden, balcony and excellent storage throughout. With its attractive end position, low-maintenance garden and well-planned accommodation, \n\nNo. 1 Cairnbrook Way is a superb home that combines comfort, practicality and privacy in a sought-after Dublin 18 setting.\n\nThe property has been carefully maintained and thoughtfully updated, with a calm neutral colour palette, timber-effect flooring and extensive fitted wardrobe storage adding to its appeal. The accommodation is particularly well proportioned, with the entrance level providing an impressive living room, defined dining area, contemporary kitchen and guest WC. French doors from the dining area open directly onto the rear patio and garden, creating a natural connection between the living and outdoor spaces. The first floor comprises two generous double bedrooms and a family bathroom, with Bedroom 2 further benefiting from access to a private balcony overlooking the development. The top floor is dedicated to the principal bedroom, which enjoys excellent privacy along with its own bathroom and useful dedicated storage.\n\nCairnbrook is a highly regarded residential development of quality homes, discreetly positioned off Glenamuck Road South in Carrickmines. The location offers an excellent balance of convenience and tranquillity, with Foxrock, Stepaside and Kilternan all within easy reach, providing a superb selection of cafés, restaurants, specialist shops and everyday amenities. Carrickmines Retail Park is also nearby, while the surrounding area offers an abundance of sporting and leisure facilities. The location is exceptionally well served by transport links, with the L26 and L27 bus routes stopping directly at the entrance to the development. The LUAS, M50 and N11 are also within easy reach, offering excellent connectivity throughout Dublin and beyond. A number of excellent schools, recreational facilities and employment centres are also located nearby."},{"ContentType":"Accommodation","SortOrder":1,"Content":"Entrance Porch - 4'11\" (1.5m) x 2'2\" (0.66m)\nCovered entrance porch opening into the reception hall.\n\nEntrance Hall\nBright and welcoming entrance hall with timber-effect flooring and staircase access to the upper floors.\n\nLiving Room - 9'7\" (2.92m) x 20'10\" (6.35m)\nA spacious and well-proportioned reception room with a front-facing window providing excellent natural light. The room features attractive timber-effect flooring and bespoke fitted cabinetry, shelving and a media unit, providing excellent storage while retaining ample space for a variety of lounge furniture. The living room flows naturally through to the dining area and kitchen at the rear of the property.\n\nDining Room - 5'10\" (1.78m) x 10'6\" (3.2m)\nWell-defined dining space positioned conveniently beside the kitchen, with ample room for a dining table and chairs. French doors open directly onto the rear patio and garden, creating an ideal connection to the outdoor space.\n\nKitchen - 6'9\" (2.06m) x 10'6\" (3.2m)\nContemporary fitted kitchen comprising an excellent range of light-coloured wall and floor units with tiled splashback and generous worktop space. Integrated cooking appliances and extractor are complemented by provision for additional appliances. A rear-facing window overlooks the garden.\n\nGuest WC\nComprises WC and wash-hand basin. Practical provision for a washing machine is also located within this area.\n\nFirst Floor\n\nBedroom 2 - 12'8\" (3.86m) x 13'10\" (4.22m)\nA generous double bedroom positioned to the front of the property, featuring fitted wardrobes and neutral carpeting. The room benefits from access to a private balcony overlooking the development.\n\nBalcony - 4'10\" (1.47m) x 2'2\" (0.66m)\nPrivate balcony providing an attractive outdoor space with a leafy outlook across the development.\n\nBedroom 3 - 12'8\" (3.86m) x 10'0\" (3.05m)\nA comfortable double bedroom overlooking the rear garden, finished with neutral carpeting and excellent fitted wardrobe storage.\n\nBathroom - 5'7\" (1.7m) x 7'2\" (2.18m)\nComprises bath with shower attachment and glazed shower screen, WC and wash-hand basin. Finished with tiled flooring and tiled bath surround.\n\nSecond Floor\n\nPrincipal Bedroom - 10'4\" (3.15m) x 13'8\" (4.17m)\nA private and spacious top-floor double bedroom enjoying excellent natural light from two rooflights together with additional windows. Finished with neutral carpeting, the room benefits from direct access to the adjoining bathroom and separate dedicated storage.\n\nEn suite - 5'3\" (1.6m) x 8'0\" (2.44m)\nComprises shower enclosure, WC and wash-hand basin. A rooflight provides excellent natural light.\n\nStorage Room - 7'1\" (2.16m) x 4'4\" (1.32m)\nUseful dedicated storage room located off the upper landing.\n\nOutside\n\nTo the Front\nNo. 1 enjoys an attractive end-of-terrace position within the development and is approached via a pedestrian pathway through well-maintained communal landscaped grounds.\n\nRear Garden / Patio\nThe enclosed rear garden provides an excellent low-maintenance outdoor space, finished with artificial grass and a paved patio area immediately adjoining the house. Mature planting beyond the boundary provides a pleasant leafy outlook and a good degree of privacy.\n\nNotice\nThese particulars are issued by Mark Kelly & Associates (MKA) on the understanding that all negotiations are conducted through us. They are provided in good faith for guidance only and do not form part of any offer or contract. MKA has not tested any apparatus, fixtures, fittings, services
